# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Make the status line pretty with catppuccin theme
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavour 'mocha'
set -g @catppuccin_window_status_style "rounded"
run ~/.tmux/plugins/tmux/catppuccin.tmux

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g @catppuccin_window_current_text "#W"
set -g @catppuccin_window_current_text_color "#{@thm_red}"
set -g @catppuccin_window_current_number_color "#{@thm_red}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

set -g @catppuccin_pane_color ""

# #{?window_activity_flag, #[], #[]} 
# tmux setting
set -g default-terminal 'xterm-256color'
set -ag terminal-overrides ",xterm-256color:RGB"
set -g renumber-windows on
set -g mouse on

# Visual mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel












# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
